version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctf-postgres
    environment:
      POSTGRES_USER: ctf
      # Password diambil dari file .env (git-ignore), bukan dari file ini.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di file .env}
      POSTGRES_DB: ctf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
